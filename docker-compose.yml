services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    expose:
      - "5000"
    restart: unless-stopped

  web-nginx:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5757:5757"
    depends_on:
      - backend
    restart: unless-stopped
