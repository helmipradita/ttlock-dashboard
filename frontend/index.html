<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTLOCK Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>TTLOCK Dashboard</h1>
    </div>
    <div class="header-right">
      <div id="account-info" class="account-info hidden">
        <div class="account-badge">
          <span class="account-icon">👤</span>
          <span id="account-username">-</span>
        </div>
        <div class="token-status">
          <span class="status-dot" id="status-dot"></span>
          <span id="token-status-text">-</span>
        </div>
        <div class="token-expiry">
          Expires: <span id="token-expires">-</span>
        </div>
      </div>
      <div id="auth-error" class="auth-error hidden">
        <span class="status-dot dot-red"></span>
        <span>Not authenticated</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Section 1: Lock History by ID -->
    <section class="card" id="section-history">
      <h2>Lock History by ID</h2>
      <div class="search-bar">
        <input type="text" id="lock-id-input" placeholder="Enter Lock ID (e.g. 35057430)" />
        <button id="search-btn" onclick="searchLock()">Search</button>
      </div>

      <div id="lock-detail" class="hidden">
        <h3>Lock Info</h3>
        <div class="lock-info-grid">
          <div class="info-item">
            <label>Name</label>
            <span id="lock-name">-</span>
          </div>
          <div class="info-item">
            <label>Alias</label>
            <span id="lock-alias">-</span>
          </div>
          <div class="info-item">
            <label>Battery</label>
            <span id="lock-battery">-</span>
          </div>
          <div class="info-item">
            <label>MAC</label>
            <span id="lock-mac">-</span>
          </div>
          <div class="info-item">
            <label>Lock ID</label>
            <span id="lock-id-display">-</span>
          </div>
          <div class="info-item">
            <label>Model</label>
            <span id="lock-model">-</span>
          </div>
          <div class="info-item">
            <label>Firmware</label>
            <span id="lock-firmware">-</span>
          </div>
        </div>

        <div class="gateway-section">
          <h4>Gateway</h4>
          <div id="lock-gateway-info">-</div>
        </div>
      </div>

      <div id="lock-records-section" class="hidden">
        <h3>Unlock History <span id="records-total" class="records-total"></span></h3>
        <div class="table-wrapper">
          <table id="records-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>Method</th>
                <th>Operator</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="records-body">
            </tbody>
          </table>
        </div>
        <div id="records-pagination" class="pagination"></div>
      </div>
    </section>

    <!-- Section 2: All Lockboxes -->
    <section class="card" id="section-all-locks">
      <div class="section-header">
        <h2 id="locks-count">All Lockboxes</h2>
        <div class="controls">
          <button id="pause-btn" class="btn-pause" onclick="togglePause()">⏸ Pause</button>
          <span id="countdown" class="countdown">Next refresh: 5:00</span>
          <button class="btn-refresh" onclick="forceRefreshAll()">🔄 Refresh Now</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="locks-table">
          <thead>
            <tr>
              <th class="sortable" onclick="sortLocks('lockId')">Lock ID<span class="sort-arrow" id="sort-lockId"></span></th>
              <th class="sortable" onclick="sortLocks('lockName')">Name<span class="sort-arrow" id="sort-lockName"></span></th>
              <th class="sortable" onclick="sortLocks('lockAlias')">Alias<span class="sort-arrow" id="sort-lockAlias"></span></th>
              <th class="sortable" onclick="sortLocks('lastOpen')">Last Open<span class="sort-arrow" id="sort-lastOpen"></span></th>
              <th class="sortable" onclick="sortLocks('electricQuantity')">Battery<span class="sort-arrow" id="sort-electricQuantity"></span></th>
              <th class="sortable" onclick="sortLocks('hasGateway')">Gateway<span class="sort-arrow" id="sort-hasGateway"></span></th>
            </tr>
          </thead>
          <tbody id="locks-body">
          </tbody>
        </table>
      </div>
      <div id="locks-loading" class="loading">Loading lockboxes...</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
